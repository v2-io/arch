# ASF's system, as a model to argue with. Iteration 1, councils-46, 2026-11-04, against KERNEL.md draft 2 (arch 6f0b16c).
# Read with ASF-SYSTEM-MODEL.md beside it. `python3 render.py` draws out/asf-system.svg and writes out/report.md.
#
# Registers: structure is proposed. Every gain carries its tag: measured (from the sprint's trail, source named),
# estimate, or guess. Gains are items of the output type per item processed; no clock appears anywhere.

lanes:            # left to right, Joseph's diagram (2026-11-04 01:09Z) plus where things leave
  - {id: outside_in,  label: "Other stores and the world (influx)"}
  - {id: influx,      label: "Influx"}
  - {id: working,     label: "Working (computed standing, not a place)"}
  - {id: canon,       label: "Canon (citable standing)"}
  - {id: explanation, label: "Explanation and pedagogy"}
  - {id: application, label: "Application (the edge to reality)"}
  - {id: outside_out, label: "Set aside to other stores"}
  - {id: sinks,       label: "Sinks"}

# Stocks: kinds of atom (Petri places). kernel: true marks kinds KERNEL draft 2 owns; the rest are ASF's to admit.
stocks:
  ext_source:    {lane: outside_in, label: "papers, prior art,\nlogos / vivarium / udon,\ntranscripts, readers", external: true}
  source:        {lane: influx, kernel: true, label: "source", terminal: [retired]}
  unit:          {lane: influx, kernel: true, label: "unit", terminal: [crossed]}
  finding:       {lane: working, label: "finding\n(typed: math · scope · restatement ·\nnotation · citation · comprehension)", terminal: [answered, rejected, known-defect]}
  question:      {lane: working, label: "question\n(with a closer)", terminal: [answered, rejected, superseded]}
  changeset:     {lane: working, kernel: true, label: "changeset\n(intent · invariant · scope)", terminal: [committed, aborted]}
  tension:       {lane: working, label: "tension\n(two supported claims)", terminal: [resolved]}
  demand:        {lane: working, kernel: true, label: "demand\n(a refused act)", terminal: [answered, declined, duplicate]}
  claim:         {lane: canon, label: "claim at statement grain\n(definition · scope · postulate · choice ·\nclaim · no-go · norm · recognition)", terminal: [retired, superseded], note: "kind is per atom; an ASF prefix is only a hint: def→definition, scope→scope, post→postulate, form→choice, der/deriv/result/obs→claim (derived or empirical stage), hyp/sketch→claim (earlier stage), disc→recognition or teaching, impl/intro/example→teaching or arrangement"}
  check:         {lane: canon, label: "review\n(what a checker sent back: an atom;\neach check in it is an event on a claim's\nevidence line, its lapse a projection)", terminal: [taken, superseded]}
  claim_record:  {lane: canon, label: "claim record\n(describes a claim)", terminal: [retired]}
  term:          {lane: canon, label: "term and notation", terminal: [superseded]}
  decision:      {lane: canon, kernel: true, label: "decision\n(importance · assumptions as edges)", terminal: [superseded]}
  purpose:       {lane: canon, label: "purpose\n(the working thesis)", terminal: [superseded], founding: true, note: "written by the steward at founding; steward-only revision"}
  arrangement:   {lane: explanation, label: "arrangement\n(outline order; which atoms a\nsegment holds, in what order)", terminal: [retired], kernel: true}
  teaching:      {lane: explanation, label: "teaching\n(narrates)", terminal: [retired]}
  front:         {lane: explanation, label: "front statement\n(headline, caption; restates)", terminal: [retired]}
  pedagogy:      {lane: explanation, label: "pedagogy\n(reader gold, quiz, reading guides)", terminal: [retired]}
  application:   {lane: application, label: "application\n(a model or measurement\non an agent the theory did not build)", terminal: [retired]}
  run:           {lane: application, label: "run\n(era-keyed)", terminal: [expired]}
  ext_out:       {lane: outside_out, label: "logos · vivarium ·\npedagogy store · udon", external: true}

sinks: [already-present, duplicate, superseded, stale, not-work, rejected]

# Stations: transitions (kind × verb). slot = who may perform it (a predicate over the attested actor);
# drainer = who answers for the queue being drained (null = nobody: the drain condition fails there);
# role: judgment | decision | mechanical. A decision station is where importance and, later, a charter matter.
stations:
  bring:         {kind: source, verb: bring, lane: influx, role: judgment, slot: anyone, drainer: null,
                  consumes: ext_source, produces: [source]}
  carve:         {kind: unit, verb: carve, lane: influx, role: judgment, slot: anyone, drainer: null,
                  consumes: source, produces: [unit], note: "divide a source into units; for an ASF segment, into statement-grain units"}
  cross:         {kind: unit, verb: cross, lane: influx, role: decision, slot: anyone, drainer: null,
                  consumes: unit, produces: [finding, question, claim, changeset, claim_record, term, teaching, front, pedagogy, application, run], sinks: [already-present, duplicate, superseded, stale, not-work, rejected],
                  exits: [ext_out], note: "one disposition per unit; 'copy as-is' is an outcome"}
  retire_source: {kind: source, verb: retire, lane: influx, role: mechanical, slot: engine, drainer: engine,
                  consumes: source, note: "fires when every unit is terminal: the delete-test"}
  integrate:     {kind: claim, verb: revise, lane: working, role: judgment, slot: "the original integrator (continuity)", drainer: null,
                  consumes: finding, produces: [claim, changeset], sinks: [rejected], note: "reworded or redefined; a root edit must be in a changeset"}
  answer:        {kind: question, verb: answer, lane: working, role: decision, slot: "the question's closer", drainer: null,
                  consumes: question, produces: [claim, finding, decision]}
  open_cs:       {kind: changeset, verb: open, lane: working, role: judgment, slot: anyone, drainer: null,
                  consumes: changeset, produces: [claim, unit], note: "pulls in its neighborhood: related findings, spikes, influx units"}
  commit_cs:     {kind: changeset, verb: commit, lane: working, role: decision, slot: "not the owner; importance-gated", drainer: null,
                  consumes: changeset, produces: [claim, decision], note: "judges the whole: more true, coherence included"}
  halt_cs:       {kind: changeset, verb: halt, lane: working, role: decision, slot: "breaker (mechanical) → reframing", drainer: null,
                  consumes: changeset, produces: [question, tension], note: "generations per finding kind stop shrinking"}
  hold_tension:  {kind: tension, verb: resolve, lane: working, role: decision, slot: "on bearing evidence only", drainer: null,
                  consumes: tension, produces: [claim, decision]}
  admit:         {kind: definition, verb: admit, lane: working, role: decision, slot: steward, drainer: steward,
                  consumes: demand, produces: [decision], note: "the founding questions, answered against the demanding material"}
  secure:        {kind: check, verb: take, lane: canon, role: judgment, slot: "did not write this version; unprimed", drainer: null,
                  consumes: claim, produces: [check]}
  confirm:       {kind: check, verb: confirm, lane: canon, role: judgment, slot: "not the reviser", drainer: null,
                  consumes: check, produces: [finding], note: "a lapsed check re-bound or ended; span-grain basis reads make most mechanical"}
  refute:        {kind: claim, verb: refute, lane: canon, role: judgment, slot: "evidence, never authority", drainer: null,
                  consumes: check, produces: [finding, tension], note: "rebut: cascades as broken; undercut: re-prices softly"}
  decide:        {kind: decision, verb: decide, lane: canon, role: decision, slot: "by importance", drainer: null,
                  consumes: decision, produces: [question], note: "lapses when an assumption changes or importance rises"}
  revise_purpose: {kind: purpose, verb: revise, lane: canon, role: decision, slot: steward, drainer: steward,
                  consumes: purpose, produces: [question]}
  term_decide:   {kind: term, verb: decide, lane: canon, role: decision, slot: anyone, drainer: null,
                  consumes: term, produces: [finding]}
  arrange:       {kind: arrangement, verb: arrange, lane: explanation, role: judgment, slot: anyone, drainer: null,
                  consumes: claim, produces: [arrangement]}
  check_record:  {kind: claim_record, verb: take, lane: canon, role: judgment, slot: "did not write the record", drainer: null,
                  consumes: claim_record, produces: [check, finding], note: "records fail on their own schedule (Line A: 21 of 31)"}
  rearrange:     {kind: arrangement, verb: revise, lane: explanation, role: judgment, slot: anyone, drainer: null,
                  consumes: arrangement, produces: [finding], note: "a cold reader's order; the outline is the topical spine (RC1 10)"}
  restate:       {kind: front, verb: rebind, lane: explanation, role: judgment, slot: "not the claim's reviser", drainer: null,
                  consumes: front, produces: [finding], note: "a restatement bound to a version goes stale exactly when it changes"}
  teach:         {kind: teaching, verb: rebind, lane: explanation, role: judgment, slot: anyone, drainer: null,
                  consumes: teaching, produces: [finding]}
  read_test:     {kind: pedagogy, verb: read, lane: explanation, role: judgment, slot: "a cold reader", drainer: null,
                  consumes: pedagogy, produces: [finding], note: "comprehension measured; Joseph as test reader"}
  apply:         {kind: application, verb: apply, lane: application, role: judgment, slot: anyone, drainer: null,
                  consumes: application, produces: [check, finding, source], note: "evidence, refutation, or new influx"}
  run:           {kind: run, verb: run, lane: application, role: mechanical, slot: "pre-registered prediction", drainer: null,
                  consumes: run, produces: [check, finding]}
  m_render:      {kind: rendering, verb: check, lane: canon, role: mechanical, slot: engine, drainer: engine,
                  consumes: claim, produces: [demand], note: "every file equals the rendering of the log"}
  m_notation:    {kind: notation, verb: check, lane: canon, role: mechanical, slot: tool, drainer: null,
                  consumes: term, produces: [finding], note: "a symbol used consistently everywhere; no checker exists today"}
  m_bindings:    {kind: front, verb: check, lane: explanation, role: mechanical, slot: tool, drainer: null,
                  consumes: front, produces: [finding], note: "a headline whose bound version moved"}

# Flows for the steady-state computation. Item types are what queues hold; each is processed at one station.
# x = (I - Aᵀ)⁻¹ f gives items per unit of influx; ρ is the spectral radius of A. Two regimes:
# 'sprint' is how the Oct 30–31 sprint ran; 'founding' is the flow model's levers adopted as founding rules.
flows:
  influx: {source: 1.0}
  items:
    source:         {station: carve}
    internal_source: {station: carve}
    unit:           {station: cross}
    finding:        {station: integrate}
    owed_claim:     {station: open_cs}
    question:       {station: answer}
    claim_version:  {station: secure}
    check:          {station: secure}
    lapse:          {station: confirm}
    stale_front:    {station: restate}
    application:    {station: apply}
  gains:   # from → to : {value, tag, note}; a regime may override
    - {from: source, to: unit, value: 12, tag: estimate, note: "trackers 26 measured (371 of 14); audits 5–20, spikes 2–8 guessed"}
    - {from: unit, to: finding, value: 0.25, tag: guess, note: "about half of units are owed (measured); the split is a guess"}
    - {from: unit, to: owed_claim, value: 0.15, tag: guess}
    - {from: unit, to: question, value: 0.10, tag: guess}
    - {from: finding, to: claim_version, value: 1.0, tag: estimate, note: "one revise per answered finding (asf-flows assumption; the trail allows ~1.9)"}
    - {from: owed_claim, to: claim_version, value: 1.0, tag: estimate}
    - {from: question, to: claim_version, value: 0.3, tag: guess}
    - {from: question, to: finding, value: 0.2, tag: guess}
    - {from: claim_version, to: check, value: 1.98, tag: measured, note: "488 checks / 246 revises", regime: sprint}
    - {from: claim_version, to: check, value: 1.0, tag: proposed, note: "one independent check per landing", regime: [founding, founding_changesets]}
    - {from: check, to: finding, value: 0.64, tag: measured, note: "313 findings / 488 checks", regime: sprint}
    - {from: check, to: finding, value: 0.42, tag: measured, note: "first independent check, 65 of 153", regime: [founding, founding_changesets]}
    - {from: claim_version, to: lapse, value: 6, tag: measured, note: "median transitive dependents; the roots reach 245"}
    - {from: lapse, to: finding, value: 0.03, tag: measured, note: "one confirm pass: ~3 real changes in 120 lapses", regime: [sprint, founding]}
    - {from: lapse, to: finding, value: 0.0, tag: proposed, regime: founding_changesets, note: "limiting case: every edit with dependents is a changeset; the ~3% real changes are the change's own propagation, settled inside it before commit, not new findings in the global queue"}
    - {from: claim_version, to: stale_front, value: 3, tag: guess, note: "2–5 restatements per substantive change"}
    - {from: stale_front, to: finding, value: 0.5, tag: guess, note: "unbound restatements, found by readers", regime: sprint}
    - {from: stale_front, to: finding, value: 0.1, tag: guess, note: "bound to versions: most rebind without a finding", regime: founding}
    - {from: stale_front, to: finding, value: 0.0, tag: proposed, regime: founding_changesets, note: "limiting case: the changeset rebinds its own restatements before commit"}
    - {from: claim_version, to: application, value: 0.0, tag: measured, note: "Objective E unmet", regime: sprint}
    - {from: claim_version, to: application, value: 0.05, tag: proposed, note: "the reality edge switched on", regime: [founding, founding_changesets]}
    - {from: application, to: finding, value: 0.3, tag: guess}
    - {from: check, to: internal_source, value: 0.05, tag: guess, discovery: true, note: "strengthenings: new internal influx (discovery, not rework)"}
    - {from: internal_source, to: unit, value: 4, tag: guess, note: "a spike yields 2–8 units"}
