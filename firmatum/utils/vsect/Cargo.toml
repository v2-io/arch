[package]
name = "vsect"
version = "0.1.0"
edition = "2021"
description = "Work inside a verisectorium: records, recorded checks, open items, and a dashboard that is computed, never typed."

[[bin]]
name = "vsect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
hex = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.release]
opt-level = 2
