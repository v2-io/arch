[package]
name = "utf-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only Unicode Character Database lookup, served over MCP (stdio)"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
